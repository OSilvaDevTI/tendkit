name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The core suite on Postgres (PGlite), then again on SQLite/D1.
      - run: pnpm test
      - name: Registry is built from the current source
        run: |
          pnpm registry:build
          git diff --exit-code -- public/r || (echo "Run pnpm registry:build and commit public/r." && exit 1)
